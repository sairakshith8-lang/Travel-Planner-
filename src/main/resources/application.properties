# TravelMate Application Configuration
server.port=${PORT:8080}

# Default Active Profile (Defaults to 'h2' for zero-setup demo; set to 'mysql' to use MySQL)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# Default Datasource (H2 in-memory mode for out-of-the-box instant execution)
spring.datasource.url=jdbc:h2:mem:travelmate_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# SQL Init mode - schemas managed by Hibernate & DataInitializer
spring.sql.init.mode=never

# Static Resource Handling (Serving HTML, CSS, JS from static directory)
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Logging Configuration
logging.level.com.travelmate=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
