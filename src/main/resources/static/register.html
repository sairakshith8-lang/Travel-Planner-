<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | TravelMate - Create Your Free Account</title>
  <meta name="description" content="Sign up for TravelMate to start creating personalized travel itineraries and managing your trip budget.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="site-header">
    <div class="container nav-wrapper">
      <a href="index.html" class="brand-logo">
        <div class="logo-icon">✈</div>
        <span>Travel<span class="logo-highlight">Mate</span></span>
      </a>

      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="destinations.html" class="nav-link">Explore</a></li>
        <li><a href="my-trips.html" class="nav-link">My Trips</a></li>
        <li><a href="about.html" class="nav-link">About</a></li>
      </ul>

      <div class="nav-auth" id="nav-auth-slot">
        <a href="login.html" class="btn btn-secondary btn-sm">Login</a>
        <a href="register.html" class="btn btn-primary btn-sm active">Register</a>
      </div>

      <button class="nav-toggle-btn" aria-label="Toggle Navigation Menu">☰</button>
    </div>
  </header>

  <!-- Register Form Section -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div style="font-size: 2.2rem; margin-bottom: 8px;">🎒</div>
        <h1>Create Your Account</h1>
        <p>Join TravelMate and start planning your next Indian expedition today.</p>
      </div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="reg-name">Full Name <span class="req">*</span></label>
          <input type="text" id="reg-name" class="form-control" placeholder="e.g. Rahul Sharma" required autocomplete="name">
          <div class="invalid-feedback" id="reg-name-error"></div>
        </div>

        <div class="form-group">
          <label for="reg-email">Email Address <span class="req">*</span></label>
          <input type="email" id="reg-email" class="form-control" placeholder="name@example.com" required autocomplete="email">
          <div class="invalid-feedback" id="reg-email-error"></div>
        </div>

        <div class="form-group">
          <label for="reg-password">Password <span class="req">*</span></label>
          <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters" required autocomplete="new-password">
          <div class="form-hint">Must contain at least 6 characters.</div>
          <div class="invalid-feedback" id="reg-password-error"></div>
        </div>

        <div class="form-group">
          <label for="reg-confirm-password">Confirm Password <span class="req">*</span></label>
          <input type="password" id="reg-confirm-password" class="form-control" placeholder="Re-enter your password" required autocomplete="new-password">
          <div class="invalid-feedback" id="reg-confirm-password-error"></div>
        </div>

        <button type="submit" id="reg-submit-btn" class="btn btn-primary btn-block btn-lg" style="margin-top: 10px;">
          <span id="btn-text">Create Free Account</span>
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html" style="font-weight: 700;">Sign in here</a>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
